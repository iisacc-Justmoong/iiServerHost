# Include this file inside nginx's http {} block. Replace domain, certificates
# and the public static directory for the deployment. No paid modules required.
# Requires nginx >= 1.25.1 with SSL and HTTP/2 modules (http2 on syntax).
upstream iiwebserver_http {
    server 127.0.0.1:8080;
}
limit_req_zone $binary_remote_addr zone=iiwebserver_clients:10m rate=20r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.invalid;
    ssl_certificate /etc/iiwebserver/fullchain.pem;
    ssl_certificate_key /etc/iiwebserver/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    limit_req_status 429;

    location /static/ {
        alias /srv/iiwebserver/public/;
        autoindex off;
        limit_except GET { deny all; }
    }
    location / {
        limit_req zone=iiwebserver_clients burst=40 nodelay;
        proxy_pass http://iiwebserver_http;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_next_upstream off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
        proxy_set_header Connection close;
        proxy_set_header Upgrade "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
    }
}
